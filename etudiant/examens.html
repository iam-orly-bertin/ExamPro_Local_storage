<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3a1020">
    <title>ExamPro - Examens</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
    <link rel="stylesheet" href="css/etudiant.css">
    <script>try { var t = localStorage.getItem("theme"); if (t ? t === "sombre" : matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("sombre"); } catch (e) { }</script>
</head>

<body data-page="examens">
    <header id="entete"></header>
    <main>
        <div class="entete-page">
            <div>
                <h1>Examens</h1>
                <p class="sous-titre">Retrouvez les examens ouverts, reprenez ceux en cours et repassez ceux qui le permettent.</p>
            </div>
        </div>
        <section class="carte">
            <div class="barre-outils">
                <div class="recherche">
                    <span class="ico" data-icone="search"></span>
                    <input type="search" id="recherche" placeholder="Rechercher un examen ou un cours..." aria-label="Rechercher un examen">
                </div>
                <select id="filtreEtat" aria-label="Filtrer par état">
                    <option value="tous">Tous les examens</option>
                    <option value="a_passer">À passer</option>
                    <option value="passes">Déjà passés</option>
                </select>
                <select id="triExamens" aria-label="Trier les examens">
                    <option value="recent">Plus récents</option>
                    <option value="titre">Titre (A → Z)</option>
                    <option value="duree">Durée (courte → longue)</option>
                </select>
            </div>
            <p class="resume" id="resumeExamens">Chargement...</p>
            <div class="grille-examens" id="listeExamens"></div>
        </section>
    </main>
    <script src="../base_locale.js"></script>
    <script src="js/api.js"></script>
    <script src="js/commun.js"></script>
    <script src="js/examens.js"></script>
</body>

</html>
