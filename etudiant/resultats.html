<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3a1020">
    <title>ExamPro - Mes résultats</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
    <link rel="stylesheet" href="css/etudiant.css">
    <script>try { var t = localStorage.getItem("theme"); if (t ? t === "sombre" : matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("sombre"); } catch (e) { }</script>
</head>

<body data-page="resultats">
    <header id="entete"></header>
    <main>
        <div class="entete-page">
            <div>
                <h1>Mes résultats</h1>
                <p class="sous-titre">Suivez vos notes, votre progression et consultez vos corrections.</p>
            </div>
        </div>
        <section class="grille">
            <article class="carte stat">
                <span class="stat-icone" data-icone="clipboard-check" data-taille="22"></span>
                <div class="stat-texte"><strong id="nbResultats">0</strong><span>Examens passés</span></div>
            </article>
            <article class="carte stat">
                <span class="stat-icone" data-icone="trending-up" data-taille="22"></span>
                <div class="stat-texte"><strong id="moyenne">0 %</strong><span>Moyenne</span></div>
            </article>
            <article class="carte stat">
                <span class="stat-icone" data-icone="award" data-taille="22"></span>
                <div class="stat-texte"><strong id="meilleure">0 %</strong><span>Meilleure note</span></div>
            </article>
        </section>
        <section class="carte">
            <h2>Évolution de mes notes</h2>
            <div id="graphique"></div>
        </section>
        <section class="carte">
            <div class="barre-outils">
                <div class="recherche">
                    <span class="ico" data-icone="search"></span>
                    <input type="search" id="recherche" placeholder="Rechercher un examen..." aria-label="Rechercher un résultat">
                </div>
                <select id="filtreNiveau" aria-label="Filtrer par niveau">
                    <option value="tous">Toutes les notes</option>
                    <option value="bon">Bon (70 % et plus)</option>
                    <option value="moyen">Moyen (50 à 69 %)</option>
                    <option value="faible">Faible (moins de 50 %)</option>
                </select>
                <button type="button" id="boutonExporter" class="bouton secondaire"><span data-icone="download"></span>Exporter en CSV</button>
            </div>
            <div class="tableau-defilant">
                <table>
                    <thead>
                        <tr>
                            <th data-cle="examen">Examen</th>
                            <th data-cle="score">Score</th>
                            <th data-cle="pourcentage">Note</th>
                            <th data-cle="date_passage">Date</th>
                            <th>Correction</th>
                        </tr>
                    </thead>
                    <tbody id="listeResultats"></tbody>
                </table>
            </div>
        </section>
        <dialog id="dialogueCorrection" class="dialogue-correction">
            <div id="contenuCorrection"></div>
            <div class="actions-centre">
                <button type="button" id="fermerCorrection" class="bouton secondaire">Fermer</button>
            </div>
        </dialog>
    </main>
    <script src="../base_locale.js"></script>
    <script src="js/api.js"></script>
    <script src="js/commun.js"></script>
    <script src="js/resultats.js"></script>
</body>

</html>
